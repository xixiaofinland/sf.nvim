# Settings for issue-loop, which works through this repo's ready-for-agent issues unattended.
# Run it with `issue-loop --dry-run` first; see the script's header for everything else.

# Clones the pinned test deps and builds the apex/soql/sosl parsers into the git-ignored deps/.
SETUP='make deps'

TEST='make test'

# The fixed-name job in test.yml that passes only when every matrix job did.
TEST_CHECK=test

MERGE=squash

# Work lands on dev first; main only fast-forwards to it (see AGENTS.md).
BASE=dev

# The tests need nothing from the network once SETUP has run.
NETWORK=''

NEVER_RUN='sf commands against a real Salesforce org (org login, deploy, retrieve, apex run, data query, api request)'
NEVER_RUN_WHY='the loop has no org; the maintainer checks org behaviour by hand after merge'

AUDIENCE='sf.nvim users'
AUDIENCE_SEES='the :SF commands, keymaps, messages, terminal output and the README'
