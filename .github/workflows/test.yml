name: Run tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  build:
    name: Run tests
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Oldest supported (see README and lua/sf/health.lua), current stable, nightly.
        neovim_version: ['v0.11.0', 'stable', 'nightly']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}
      # The pinned revs live in the Makefile, so it keys the cache.
      - name: Cache test dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: test-deps-${{ hashFiles('Makefile') }}
      - name: Run tests
        run: make test

  test:
    # One check with a fixed name whatever the matrix: issue-loop's TEST_CHECK.
    name: test
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success
