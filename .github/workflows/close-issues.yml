name: Close Linked Issues
# GitHub acts on "Closes #N" only when a PR merges into the default branch
# (main), but work merges into dev, so close the linked issues here.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # Through env, not inlined, so the PR text can't inject shell.
          TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: |
          issues=$(printf '%s' "$TEXT" |
            grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' |
            grep -oE '[0-9]+$' | sort -un || true)
          for n in $issues; do
            # Not an issue (a PR number, a typo) or already closed: nothing to do.
            state=$(gh issue view "$n" --json state --jq .state 2>/dev/null) || continue
            [ "$state" = OPEN ] || continue
            gh issue close "$n" --comment "Merged into \`dev\` in #$PR."
          done
